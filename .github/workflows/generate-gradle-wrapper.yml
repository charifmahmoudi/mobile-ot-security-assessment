name: Generate Gradle Wrapper

on:
  workflow_dispatch:
    inputs:
      overwrite:
        description: Replace an existing Gradle Wrapper JAR and scripts
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out selected ref
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Refuse accidental overwrite
        if: ${{ inputs.overwrite != true && hashFiles('gradle/wrapper/gradle-wrapper.jar') != '' }}
        run: |
          echo 'An official Gradle Wrapper JAR already exists.'
          echo 'Re-run with overwrite=true only when regeneration is intentional.'
          exit 1

      - name: Generate official wrapper
        run: gradle wrapper --gradle-version 8.13 --distribution-type bin

      - name: Verify wrapper
        run: |
          test -s gradlew
          test -s gradlew.bat
          test -s gradle/wrapper/gradle-wrapper.jar
          ./gradlew --version

      - name: Commit wrapper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gradlew gradlew.bat gradle/wrapper
          if git diff --cached --quiet; then
            echo 'No wrapper changes to commit.'
            exit 0
          fi
          git commit -m 'build: add official Gradle wrapper'
          git push origin HEAD:${GITHUB_REF_NAME}
