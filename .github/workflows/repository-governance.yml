name: Repository governance

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/repository-governance.yml"
      - ".github/ISSUE_TEMPLATE/**"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  synchronize:
    name: Labels, milestone, and pilot issues
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Synchronize governance metadata
        uses: actions/github-script@v7
        with:
          script: |
            const labels = [
              { name: 'type: epic', color: '5319E7', description: 'Umbrella outcome spanning multiple delivery issues' },
              { name: 'type: feature', color: '1D76DB', description: 'Product capability or user outcome' },
              { name: 'type: defect', color: 'D73A4A', description: 'Reproducible incorrect behavior' },
              { name: 'type: validation', color: '0E8A16', description: 'Acceptance, rehearsal, or release evidence' },
              { name: 'type: research', color: '7057FF', description: 'Evidence-backed research claim or correction' },
              { name: 'type: design', color: 'C5DEF5', description: 'Architecture, UX, data, or safety decision' },
              { name: 'type: documentation', color: '0075CA', description: 'Documentation-only change' },
              { name: 'area: case', color: 'BFDADC', description: 'Professional case lifecycle and authorization' },
              { name: 'area: evidence', color: 'BFD4F2', description: 'Evidence model, parsing, and reconciliation' },
              { name: 'area: collection', color: 'D4C5F9', description: 'Passive or explicitly authorized active collection' },
              { name: 'area: reporting', color: 'FEF2C0', description: 'Findings, review, snapshots, and handoff' },
              { name: 'area: release', color: 'FBCA04', description: 'Qualification, packaging, and release evidence' },
              { name: 'priority: p0', color: 'B60205', description: 'Required for the current P0-WATER pilot outcome' },
              { name: 'status: blocked', color: '000000', description: 'Cannot progress until a named dependency is resolved' },
              { name: 'status: needs-evidence', color: 'E4E669', description: 'Implementation or claim lacks required acceptance evidence' },
              { name: 'risk: ot-safety', color: 'D93F0B', description: 'Changes or evidence with operational-technology safety impact' }
            ];

            for (const label of labels) {
              try {
                await github.rest.issues.getLabel({ owner: context.repo.owner, repo: context.repo.repo, name: label.name });
                await github.rest.issues.updateLabel({ owner: context.repo.owner, repo: context.repo.repo, name: label.name, new_name: label.name, color: label.color, description: label.description });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({ owner: context.repo.owner, repo: context.repo.repo, ...label });
              }
            }

            const title = 'P0-WATER — Customer pilot ready';
            const milestones = await github.paginate(github.rest.issues.listMilestones, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              per_page: 100
            });
            let milestone = milestones.find(item => item.title === title);
            if (!milestone) {
              const created = await github.rest.issues.createMilestone({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                description: 'One bounded, independently reviewed P0-WATER customer-pilot assessment. ROADMAP.md remains the authoritative gate-status record.'
              });
              milestone = created.data;
            } else if (milestone.state !== 'open') {
              const reopened = await github.rest.issues.updateMilestone({
                owner: context.repo.owner,
                repo: context.repo.repo,
                milestone_number: milestone.number,
                state: 'open'
              });
              milestone = reopened.data;
            }

            const pilotIssues = {
              6: ['type: feature', 'area: case', 'priority: p0'],
              7: ['type: feature', 'area: evidence', 'priority: p0'],
              8: ['type: feature', 'area: collection', 'priority: p0', 'risk: ot-safety'],
              9: ['type: feature', 'area: reporting', 'priority: p0'],
              10: ['type: validation', 'area: release', 'priority: p0', 'risk: ot-safety'],
              11: ['type: epic', 'priority: p0']
            };

            for (const [issueNumber, issueLabels] of Object.entries(pilotIssues)) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: Number(issueNumber),
                labels: issueLabels
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: Number(issueNumber),
                milestone: milestone.number
              });
            }
