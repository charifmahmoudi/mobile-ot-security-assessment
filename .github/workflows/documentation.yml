name: Documentation

on:
  push:
    paths:
      - "**/*.md"
      - "docs/**"
      - "schemas/**"
      - "tools/verify_documentation.py"
      - ".github/workflows/documentation.yml"
  pull_request:
    paths:
      - "**/*.md"
      - "docs/**"
      - "schemas/**"
      - "tools/verify_documentation.py"
      - ".github/workflows/documentation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Navigation, links, and structure
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Compile documentation verifier
        run: python3 -m py_compile tools/verify_documentation.py
      - name: Verify documentation
        run: python3 tools/verify_documentation.py
