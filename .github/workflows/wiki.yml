name: Publish Wiki

on:
  push:
    branches:
      - main
    paths:
      - "docs/wiki/**"
      - "tools/verify_documentation.py"
      - ".github/workflows/wiki.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-wiki
  cancel-in-progress: true

jobs:
  publish:
    name: Validate and publish GitHub Wiki
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate documentation
        run: |
          python3 -m py_compile tools/verify_documentation.py
          python3 tools/verify_documentation.py

      - name: Prepare Wiki source
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wiki-source"
          cp docs/wiki/Home.md "$RUNNER_TEMP/wiki-source/Home.md"
          cp docs/wiki/Assessment-Workflow.md "$RUNNER_TEMP/wiki-source/Assessment-Workflow.md"
          cp docs/wiki/Asset-Reconciliation.md "$RUNNER_TEMP/wiki-source/Asset-Reconciliation.md"
          cp docs/wiki/Customer-Pilot.md "$RUNNER_TEMP/wiki-source/Customer-Pilot.md"
          cp docs/wiki/Safety-and-Technical-Boundaries.md "$RUNNER_TEMP/wiki-source/Safety-and-Technical-Boundaries.md"
          cp docs/wiki/_Sidebar.md "$RUNNER_TEMP/wiki-source/_Sidebar.md"

      - name: Mirror source to GitHub Wiki
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          WIKI_URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git"
          WIKI_DIR="$RUNNER_TEMP/wiki-repository"
          SOURCE_DIR="$RUNNER_TEMP/wiki-source"

          git clone "$WIKI_URL" "$WIKI_DIR"
          cd "$WIKI_DIR"

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$SOURCE_DIR"/. .

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all

          if git diff --cached --quiet; then
            echo "Wiki is already up to date."
            exit 0
          fi

          git commit -m "Publish Wiki from ${GITHUB_SHA}"
          git push origin HEAD:master
