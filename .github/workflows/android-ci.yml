name: Android safety CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-lint-build:
    name: Unit, lint, architecture, APKs
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Fetch hash-pinned OT research captures
        run: bash tools/fetch_research_pcaps.sh
      - name: Verify package isolation
        run: python3 tools/verify_architecture.py
      - name: Unit tests, lint, and debug APKs
        run: >-
          gradle --no-daemon --stacktrace
          :core-domain:test
          :case-app:testDebugUnitTest
          :network-broker:testDebugUnitTest
          :case-app:assembleDebugAndroidTest
          :network-broker:assembleDebugAndroidTest
          lintDebug assembleDebug
      - name: Publish reports and APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-static-results
          if-no-files-found: warn
          path: |
            **/build/reports/**
            **/build/outputs/apk/debug/*.apk
            **/build/test-results/**/*.xml

  emulator:
    name: Emulator API ${{ matrix.api-level }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api-level: [29, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Fetch hash-pinned OT research captures
        run: bash tools/fetch_research_pcaps.sh
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run instrumentation tests
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: gradle --no-daemon --stacktrace connectedDebugAndroidTest
      - name: Publish emulator reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-api-${{ matrix.api-level }}
          if-no-files-found: warn
          path: |
            **/build/reports/androidTests/**
            **/build/outputs/androidTest-results/**

  active-testbed:
    name: Active E2E • ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Two independent libraries plus a full ICS honeypot. Keeping these as
        # separate jobs prevents one implementation from validating itself.
        target: [pymodbus, modbus-tk, conpot]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Fetch hash-pinned OT research captures
        run: bash tools/fetch_research_pcaps.sh
      - name: Prepare OT emulator
        run: |
          if [ "${{ matrix.target }}" = "pymodbus" ]; then
            docker build --tag atlas-pymodbus:3.11.3 --file tools/pymodbus-ci.Dockerfile .
          elif [ "${{ matrix.target }}" = "modbus-tk" ]; then
            python3 -m venv .ot-emulator-venv
            .ot-emulator-venv/bin/pip install --disable-pip-version-check modbus-tk==1.1.5
          else
            git clone --filter=blob:none https://github.com/mushorg/conpot.git conpot-upstream
            git -C conpot-upstream checkout 32fc03bbdbbcbbb685c8d7e086210e0ecdcd7044
            docker build --tag atlas-conpot-upstream:32fc03b conpot-upstream
            docker build --tag atlas-conpot-ci:32fc03b --file tools/conpot-ci.Dockerfile .
          fi
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run signed case-to-emulator journey
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/run_active_e2e.sh "${{ matrix.target }}"
      - name: Collect OT emulator log
        if: always()
        run: |
          if [ "${{ matrix.target }}" = "pymodbus" ]; then
            docker logs atlas-pymodbus >pymodbus.log 2>&1 || true
          elif [ "${{ matrix.target }}" = "conpot" ]; then
            docker logs atlas-conpot >conpot.log 2>&1 || true
          fi
      - name: Publish active E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: active-e2e-${{ matrix.target }}
          if-no-files-found: warn
          path: |
            **/build/reports/androidTests/**
            **/build/outputs/androidTest-results/**
            *.log
