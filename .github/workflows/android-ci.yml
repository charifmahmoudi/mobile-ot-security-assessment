name: Android safety CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-lint-build:
    name: Unit, lint, architecture, APKs
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Fetch hash-pinned OT research captures
        run: bash tools/fetch_research_pcaps.sh
      - name: Verify package isolation
        run: python3 tools/verify_architecture.py
      - name: Unit tests, lint, and debug APKs
        run: >-
          gradle --no-daemon --stacktrace
          :core-domain:test
          :case-app:testDebugUnitTest
          :network-broker:testDebugUnitTest
          :case-app:assembleDebugAndroidTest
          :network-broker:assembleDebugAndroidTest
          lintDebug assembleDebug
      - name: Publish reports and APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-static-results
          if-no-files-found: warn
          path: |
            **/build/reports/**
            **/build/outputs/apk/debug/*.apk
            **/build/test-results/**/*.xml

  emulator:
    name: Emulator API ${{ matrix.api-level }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api-level: [29, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Fetch hash-pinned OT research captures
        run: bash tools/fetch_research_pcaps.sh
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run instrumentation tests
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: gradle --no-daemon --stacktrace connectedDebugAndroidTest
      - name: Publish emulator reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-api-${{ matrix.api-level }}
          if-no-files-found: warn
          path: |
            **/build/reports/androidTests/**
            **/build/outputs/androidTest-results/**

  active-testbed:
    name: Active E2E • ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: [pymodbus, conpot]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Fetch hash-pinned OT research captures
        run: bash tools/fetch_research_pcaps.sh
      - name: Start OT emulator on TCP 502
        run: |
          if [ "${{ matrix.target }}" = "pymodbus" ]; then
            python3 -m venv .pymodbus-venv
            .pymodbus-venv/bin/pip install --disable-pip-version-check pymodbus==3.11.3
            sudo -E .pymodbus-venv/bin/python tools/pymodbus_testbed.py >pymodbus.log 2>&1 &
          else
            docker run --detach --name atlas-conpot --publish 502:5020 mushorg/conpot:latest
          fi
          for attempt in $(seq 1 90); do
            nc -z 127.0.0.1 502 && exit 0
            sleep 1
          done
          echo "OT emulator did not expose TCP/502" >&2
          exit 1
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run signed case-to-emulator journey
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            gradle --no-daemon --stacktrace :network-broker:installDebug
            gradle --no-daemon --stacktrace :case-app:connectedDebugAndroidTest \
              -Pandroid.testInstrumentationRunnerArguments.activeTest=true \
              -Pandroid.testInstrumentationRunnerArguments.expectedIdentity=MODBUS
      - name: Publish active E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: active-e2e-${{ matrix.target }}
          if-no-files-found: warn
          path: |
            **/build/reports/androidTests/**
            **/build/outputs/androidTest-results/**
            *.log
