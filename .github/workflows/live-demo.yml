name: Live emulator demo

on:
  workflow_dispatch:
  push:
    paths:
      - "case-app/**"
      - "capture-broker/**"
      - "network-broker/**"
      - "tools/record_live_demo.sh"
      - "tools/build_pitch_deck.js"
      - "tools/pymodbus-ci.Dockerfile"
      - ".github/workflows/live-demo.yml"
  pull_request:
    paths:
      - "case-app/**"
      - "capture-broker/**"
      - "network-broker/**"
      - "tools/record_live_demo.sh"
      - "tools/build_pitch_deck.js"
      - "tools/pymodbus-ci.Dockerfile"
      - ".github/workflows/live-demo.yml"

permissions:
  contents: write

jobs:
  record:
    name: Record water-assessment user story
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Install media and document tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libreoffice-impress poppler-utils
      - name: Fetch hash-pinned OT research captures
        run: bash tools/fetch_research_pcaps.sh
      - name: Build controlled PyModbus demo target
        run: docker build --tag atlas-pymodbus:3.11.3 --file tools/pymodbus-ci.Dockerfile .
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Record actual Android user-story behavior
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/record_live_demo.sh
      - name: Capture active-identity proof frame
        run: |
          ffmpeg -hide_banner -loglevel error -y \
            -ss 24.0 \
            -i docs/demo/atlas-ot-scout-emulator-demo.mp4 \
            -frames:v 1 \
            docs/user-guide/screenshots/09-active-pymodbus-api35.png
          test -s docs/user-guide/screenshots/09-active-pymodbus-api35.png
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build buyer deck and PDF
        run: |
          npm install --no-save --no-package-lock pptxgenjs@4.0.0
          node tools/build_pitch_deck.js
          rm -f docs/pitch/Atlas-OT-Scout-Pitch-and-Demo.pdf
          libreoffice --headless --nologo --nolockcheck \
            --convert-to pdf \
            --outdir docs/pitch \
            docs/pitch/Atlas-OT-Scout-Pitch-and-Demo.pptx
          test -s docs/pitch/Atlas-OT-Scout-Pitch-and-Demo.pptx
          test -s docs/pitch/Atlas-OT-Scout-Pitch-and-Demo.pdf
          unzip -t docs/pitch/Atlas-OT-Scout-Pitch-and-Demo.pptx >/dev/null
          pdfinfo docs/pitch/Atlas-OT-Scout-Pitch-and-Demo.pdf >/dev/null
          python3 tools/verify_documentation.py
      - name: Commit refreshed buyer assets
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/demo/atlas-ot-scout-emulator-demo.mp4 \
            docs/user-guide/screenshots/09-active-pymodbus-api35.png \
            docs/pitch/Atlas-OT-Scout-Pitch-and-Demo.pptx \
            docs/pitch/Atlas-OT-Scout-Pitch-and-Demo.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Refresh buyer pitch and live user-story demo"
            git push origin HEAD:main
          fi
      - name: Publish live demo, deck and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-ot-scout-buyer-demo
          if-no-files-found: error
          path: |
            docs/demo/atlas-ot-scout-emulator-demo.mp4
            docs/user-guide/screenshots/09-active-pymodbus-api35.png
            docs/pitch/Atlas-OT-Scout-Pitch-and-Demo.pptx
            docs/pitch/Atlas-OT-Scout-Pitch-and-Demo.pdf
            build/live-demo/video-metadata.txt
            build/live-demo/pymodbus-demo.log
