name: Live emulator demo

on:
  workflow_dispatch:
  push:
    paths:
      - "case-app/**"
      - "capture-broker/**"
      - "network-broker/**"
      - "tools/record_live_demo.sh"
      - "tools/compose_guided_customer_story.py"
      - "tools/build_pitch_deck.js"
      - "tools/brand_palette.py"
      - "tools/retint_pitch_deck.py"
      - "tools/pymodbus-ci.Dockerfile"
      - ".github/workflows/live-demo.yml"
  pull_request:
    paths:
      - "case-app/**"
      - "capture-broker/**"
      - "network-broker/**"
      - "tools/record_live_demo.sh"
      - "tools/compose_guided_customer_story.py"
      - "tools/build_pitch_deck.js"
      - "tools/brand_palette.py"
      - "tools/retint_pitch_deck.py"
      - "tools/pymodbus-ci.Dockerfile"
      - ".github/workflows/live-demo.yml"

permissions:
  contents: write

jobs:
  record:
    name: Build guided prospect story
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Install media, story-composition and document tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            libreoffice-impress \
            poppler-utils \
            python3-numpy \
            python3-opencv \
            python3-pil
      - name: Fetch hash-pinned OT research captures
        run: bash tools/fetch_research_pcaps.sh
      - name: Build controlled PyModbus demo target
        run: docker build --tag atlas-pymodbus:3.11.3 --file tools/pymodbus-ci.Dockerfile .
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Record actual Android application behavior
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/record_live_demo.sh
      - name: Build paced customer-story video
        run: |
          mkdir -p build/live-demo/deck-frames
          cp docs/demo/atlas-ot-scout-emulator-demo.mp4 \
            build/live-demo/atlas-ot-scout-app-capture.mp4

          # The deterministic Android interaction can vary by roughly one second
          # across hosted runners. Preserve the untouched capture above, then make
          # a 39-second story source by holding its final frame. The guided story
          # uses source moments only through 38 seconds.
          ffmpeg -hide_banner -loglevel error -y \
            -i build/live-demo/atlas-ot-scout-app-capture.mp4 \
            -vf "tpad=stop_mode=clone:stop_duration=3" \
            -af "apad=pad_dur=3" \
            -t 39.0 \
            -c:v libx264 -profile:v baseline -level:v 4.0 -preset veryfast -crf 22 \
            -pix_fmt yuv420p -tag:v avc1 \
            -c:a aac -profile:a aac_low -b:a 96k \
            -movflags +faststart \
            build/live-demo/atlas-ot-scout-app-story-source.mp4

          for spec in \
            "06 6" "08 8" "10 10" "12 12" "16 16" \
            "20 20" "22 22" "26 26" "28 28" "36 36"; do
            set -- $spec
            ffmpeg -hide_banner -loglevel error -y \
              -ss "$2" \
              -i build/live-demo/atlas-ot-scout-app-story-source.mp4 \
              -frames:v 1 \
              "build/live-demo/deck-frames/f$1.png"
          done

          python3 tools/compose_guided_customer_story.py \
            --input build/live-demo/atlas-ot-scout-app-story-source.mp4 \
            --output docs/demo/atlas-ot-scout-emulator-demo.mp4

          ffmpeg -hide_banner -loglevel error -y \
            -ss 2.0 \
            -i docs/demo/atlas-ot-scout-emulator-demo.mp4 \
            -frames:v 1 \
            build/live-demo/video-poster.png

          duration="$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 docs/demo/atlas-ot-scout-emulator-demo.mp4)"
          python3 - "$duration" <<'PY'
          import sys
          duration = float(sys.argv[1])
          if not 108.5 <= duration <= 109.5:
              raise SystemExit(f"unexpected guided-story duration: {duration}")
          PY

          ffmpeg -v error -i docs/demo/atlas-ot-scout-emulator-demo.mp4 -f null -
      - name: Capture active-identity proof frame
        run: |
          ffmpeg -hide_banner -loglevel error -y \
            -ss 72.0 \
            -i docs/demo/atlas-ot-scout-emulator-demo.mp4 \
            -frames:v 1 \
            docs/user-guide/screenshots/09-active-pymodbus-api35.png
          test -s docs/user-guide/screenshots/09-active-pymodbus-api35.png
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Build guided prospect deck and PDF
        run: |
          npm install --no-save --no-package-lock pptxgenjs@4.0.0
          node tools/build_pitch_deck.js
          python3 tools/retint_pitch_deck.py docs/pitch/Atlas-OT-Scout-Pitch-and-Demo.pptx
          rm -f docs/pitch/Atlas-OT-Scout-Pitch-and-Demo.pdf
          libreoffice --headless --nologo --nolockcheck \
            --convert-to pdf \
            --outdir docs/pitch \
            docs/pitch/Atlas-OT-Scout-Pitch-and-Demo.pptx
          test -s docs/pitch/Atlas-OT-Scout-Pitch-and-Demo.pptx
          test -s docs/pitch/Atlas-OT-Scout-Pitch-and-Demo.pdf
          unzip -t docs/pitch/Atlas-OT-Scout-Pitch-and-Demo.pptx >/dev/null
          unzip -l docs/pitch/Atlas-OT-Scout-Pitch-and-Demo.pptx | grep -Eq 'ppt/media/.*\.mp4'
          test "$(pdfinfo docs/pitch/Atlas-OT-Scout-Pitch-and-Demo.pdf | awk '/^Pages:/ {print $2}')" -eq 14
          python3 tools/verify_documentation.py
      - name: Commit refreshed guided prospect assets
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/demo/atlas-ot-scout-emulator-demo.mp4 \
            docs/user-guide/screenshots/09-active-pymodbus-api35.png \
            docs/pitch/Atlas-OT-Scout-Pitch-and-Demo.pptx \
            docs/pitch/Atlas-OT-Scout-Pitch-and-Demo.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Refresh guided customer story and prospect pitch"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Publish guided story, deck and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-ot-scout-buyer-demo
          if-no-files-found: error
          path: |
            docs/demo/atlas-ot-scout-emulator-demo.mp4
            docs/user-guide/screenshots/09-active-pymodbus-api35.png
            docs/pitch/Atlas-OT-Scout-Pitch-and-Demo.pptx
            docs/pitch/Atlas-OT-Scout-Pitch-and-Demo.pdf
            build/live-demo/atlas-ot-scout-app-capture.mp4
            build/live-demo/video-metadata.txt
            build/live-demo/pymodbus-demo.log
